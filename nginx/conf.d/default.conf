server {
    listen 80;
    server_name localhost;
    # 统一 UTF-8，避免中文乱码
    charset utf-8;

    # 文件上传最大 10MB（与后端 multipart 限制一致，默认 1m 会导致上传 413）
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # API 反向代理到网关（保留 /api 前缀，网关按路由转发到各微服务）
    location /api/ {
        proxy_pass http://campus-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /nacos/ {
        proxy_pass http://nacos:8848/nacos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sentinel/ {
        proxy_pass http://sentinel:8858/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态资源（Vue SPA，含 /admin 管理后台 history 路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
